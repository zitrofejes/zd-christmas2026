<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Organiser view · ZD Christmas 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <p class="demo" id="demo-banner" hidden>Demo mode: sample data, not connected to Firebase yet.</p>

  <main class="wrap wide">
    <header class="hero">
      <p class="eyebrow">Organiser view</p>
      <h1 id="event-title">ZD Christmas 2026</h1>
    </header>

    <section class="card center" id="loading-card" aria-busy="true">
      <span class="spinner dark" aria-hidden="true"></span>
      <p class="muted" id="loading-text">Loading…</p>
    </section>

    <section class="card center" id="auth-card" hidden>
      <h2>Organisers only</h2>
      <p class="muted">Sign in with an organiser's Google account to see the replies.</p>
      <p class="error" id="auth-error" role="alert" hidden></p>
      <button class="btn btn-google" id="sign-in" type="button">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
        <span class="btn-label">Sign in with Google</span>
        <span class="spinner dark" aria-hidden="true"></span>
      </button>
    </section>

    <section class="card" id="data-card" hidden>
      <div class="toolbar">
        <p class="me" style="margin:0"><span>Signed in as <b id="me-email"></b></span></p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn ghost" id="refresh" type="button">Refresh</button>
          <button class="btn" id="csv" type="button">Download CSV</button>
          <button class="linkish sign-out" type="button">Sign out</button>
        </div>
      </div>

      <div class="stats" id="stats"></div>

      <div class="filters">
        <input type="search" id="search" placeholder="Search name, email, team, notes…" aria-label="Search replies" />
        <button class="chip" data-filter="" aria-pressed="true" type="button">All</button>
        <button class="chip" data-filter="Yes" aria-pressed="false" type="button">Coming</button>
        <button class="chip" data-filter="Maybe" aria-pressed="false" type="button">Maybe</button>
        <button class="chip" data-filter="No" aria-pressed="false" type="button">Not coming</button>
        <button class="chip" data-filter="dietary" aria-pressed="false" type="button">Dietary notes</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Name</th><th>Email</th><th>Team</th><th>Answer</th><th>Plus one</th><th>Dietary</th><th>Message</th><th>Updated</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <footer class="foot"><a href="./">← Back to the RSVP page</a></footer>
  </main>

  <script src="config.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
